<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Account - LiteCore Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="requireAuth()">
  <header class="header">
    <div class="brand">LiteCore Shop</div>
    <nav>
      <a href="home.html">Home</a>
      <a href="products.html">Products</a>
      <a href="#" onclick="logoutAndRedirect()">Logout</a>
    </nav>
  </header>

  <div class="container">
    <div class="card" style="max-width:520px;margin:28px auto">
      <h3>Change Password</h3>
      <input id="oldP" class="input" type="password" placeholder="Current password">
      <input id="newP" class="input" type="password" placeholder="New password">
      <button class="btn" onclick="changePassword()">Update password</button>
      <pre id="out"></pre>
    </div>

    <div class="card" style="max-width:520px;margin:28px auto">
      <h3>Danger zone</h3>
      <p class="small">Delete your account (this will remove your cart too).</p>
      <button class="btn danger" onclick="deleteAccount()">Delete account</button>
    </div>
  </div>

<script src="auth.js"></script>
<script>
requireAuth();

async function changePassword(){
  const oldP = document.getElementById('oldP').value;
  const newP = document.getElementById('newP').value;
  const res = await apiPut('/update',{ oldPassword: oldP, newPassword: newP });
  document.getElementById('out').textContent = JSON.stringify(res,null,2);
  if(res.message) alert(res.message);
}

async function deleteAccount(){
  if(!confirm('Delete your account? This is irreversible.')) return;
  const res = await apiDelete('/delete');
  alert(res.status==='success' ? 'Account deleted' : (res.error||'Failed'));
  if(res.status==='success') logoutAndRedirect();
}
</script>
</body>
</html>
