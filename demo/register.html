<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Register - LiteCore Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">LiteCore Shop</div>
    <nav><a href="login.html">Sign in</a></nav>
  </header>

  <div class="container">
    <div class="card" style="max-width:520px;margin:36px auto">
      <h2>Create an account</h2>
      <p class="small">Register to try the LiteCore demo shop.</p>

      <input id="username" class="input" placeholder="Choose username" />
      <input id="password" type="password" class="input" placeholder="Choose password" />

      <div style="display:flex;gap:12px">
        <button class="btn" id="btnRegister">Create account</button>
      </div>

      <pre id="out" style="margin-top:12px"></pre>
    </div>
  </div>

<script src="auth.js"></script>
<script>
document.getElementById('btnRegister').addEventListener('click', async () => {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(!u||!p){ alert('enter username & password'); return; }
  const res = await apiPost('/register', { username: u, password: p });
  document.getElementById('out').textContent = JSON.stringify(res, null, 2);
  if(res.status === 'success') {
    alert('Account created — please login');
    window.location.href = 'login.html';
  }
});
</script>
</body>
</html>
