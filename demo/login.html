<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Login - LiteCore Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">LiteCore Shop</div>
    <nav><a href="register.html">Sign up</a></nav>
  </header>

  <div class="container">
    <div class="card" style="max-width:420px;margin:36px auto">
      <h2>Welcome back</h2>
      <p class="small">Sign in to access your store dashboard.</p>

      <input id="username" class="input" placeholder="Username" />
      <input id="password" type="password" class="input" placeholder="Password" />

      <button class="btn" id="btnLogin">Sign in</button>

      <div class="row" style="margin-top:12px;justify-content:space-between">
        <div class="small">Don't have an account? <a href="register.html">Register</a></div>
        <div class="small"><a href="account.html" onclick="event.preventDefault()">Forgot?</a></div>
      </div>

      <pre id="out" style="margin-top:12px;color:#333;white-space:pre-wrap"></pre>
    </div>
  </div>

<script src="auth.js"></script>
<script>
/* Non-module friendly API usage (auth.js must define global functions) */
async function handleLogin(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(!u||!p){ alert('enter username & password'); return; }
  const res = await apiPost('/login',{ username: u, password: p });
  document.getElementById('out').textContent = JSON.stringify(res, null, 2);
  if(res.token){
    setToken(res.token);
    window.location.href = 'home.html';
  } else if (res.status === 'success' && res.token) {
    setToken(res.token); window.location.href='home.html';
  }
}
document.getElementById('btnLogin').addEventListener('click', handleLogin);
</script>
</body>
</html>
